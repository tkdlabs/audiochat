[workspace]
resolver = "2"
members = [
    "audiochat-core",
    "audiochat-stt-whisper",
    "audiochat-tts-piper",
    "audiochat-llm",
    "audiochat-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tkdlabs/audiochat"

[workspace.dependencies]
audiochat-core = { path = "audiochat-core" }
audiochat-stt-whisper = { path = "audiochat-stt-whisper" }
audiochat-tts-piper = { path = "audiochat-tts-piper" }
audiochat-llm = { path = "audiochat-llm" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
